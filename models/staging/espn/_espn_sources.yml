version: 2

sources:
  - name: espn
    description: "Raw ESPN data landed by yamal_scout/ingest_espn.py"
    database: skymetrics-project
    schema: yamal_scout
    tables:
      - name: raw_espn_gamelog
        description: "One row per match Lamine Yamal played (full refresh on every ingest)."
        config:
          loaded_at_field: ingested_at
          freshness:
            warn_after: {count: 7, period: day}
            error_after: {count: 14, period: day}
        columns:
          - name: event_id
            description: "ESPN match id."
            data_tests:
              - not_null
